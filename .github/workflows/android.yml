name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source integrity
        run: bash scripts/verify-source-integrity.sh

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download and verify Android Java runtimes
        run: bash scripts/download-runtimes.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '7.6.1'
          cache-provider: basic

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Google Play AAB
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleGplay --no-daemon
          mkdir -p out
          cp app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab

      - name: Build debug APK with runtimes
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mkdir -p out/runtime
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/runtime/app-debug.apk

      - name: Build debug APK without runtimes
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mkdir -p out/no-runtime
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/no-runtime/app-debug-noruntime.apk

      - name: Verify packaged APK contents
        run: |
          bash scripts/verify-apk.sh out/runtime/app-debug.apk runtime
          bash scripts/verify-apk.sh out/no-runtime/app-debug-noruntime.apk no-runtime

      - name: Generate build provenance and checksums
        shell: bash
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          GLFW_CLASSES_SHA256="$(sha256sum app_pojavlauncher/src/main/assets/components/lwjgl3/lwjgl-glfw-classes.jar | cut -d' ' -f1)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for VARIANT in runtime no-runtime; do
            APK_DIR="out/${VARIANT}"
            APK="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)"
            test -n "$APK"
            cp out/runtime-sources.txt "$APK_DIR/runtime-sources.txt"
            sha256sum "$APK" "$APK_DIR/runtime-sources.txt" > "$APK_DIR/SHA256SUMS"
            cat > "$APK_DIR/build-info.json" <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${SOURCE_COMMIT}",
            "triggering_commit": "${GITHUB_SHA}",
            "lwjgl_glfw_classes_sha256": "${GLFW_CLASSES_SHA256}",
            "gradle_version": "7.6.1",
            "build_java_version": "17",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "${RUN_URL}",
            "built_at_utc": "${BUILT_AT}",
            "variant": "${VARIANT}",
            "runtime_sources_file": "runtime-sources.txt"
          }
          EOF
          done

      - name: Upload debug APK with runtimes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: 2009scape-mobile-debug-runtime-${{ github.run_number }}
          path: out/runtime/
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK without runtimes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: 2009scape-mobile-debug-no-runtime-${{ github.run_number }}
          path: out/no-runtime/
          if-no-files-found: error
          retention-days: 30
